    <use href="#d05" x="76" y="24"/><use href="#d05" x="63" y="24"/><use href="#d05" x="76" y="37"/>
    <use href="#d05" x="24" y="76"/><use href="#d05" x="37" y="76"/><use href="#d05" x="24" y="63"/>
    <use href="#d05" x="76" y="76"/><use href="#d05" x="63" y="76"/><use href="#d05" x="76" y="63"/>
  </g>
</svg>
