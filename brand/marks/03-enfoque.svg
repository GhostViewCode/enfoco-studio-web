<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="En Foco">
  <!-- 03 · Enfoque — matriz de puntos. El desenfoque hecho geometría: los puntos
       crecen y se solidifican hacia el centro. Es literalmente una imagen
       entrando en foco, y resume el negocio sin dibujar una cámara. -->
  <g fill="currentColor">
    <!-- anillo exterior: disperso y tenue -->
    <g opacity="0.3">
      <circle cx="24" cy="24" r="1.8"/><circle cx="37" cy="24" r="1.8"/><circle cx="50" cy="24" r="1.8"/><circle cx="63" cy="24" r="1.8"/><circle cx="76" cy="24" r="1.8"/>
      <circle cx="24" cy="37" r="1.8"/><circle cx="76" cy="37" r="1.8"/>
      <circle cx="24" cy="50" r="1.8"/><circle cx="76" cy="50" r="1.8"/>
      <circle cx="24" cy="63" r="1.8"/><circle cx="76" cy="63" r="1.8"/>
      <circle cx="24" cy="76" r="1.8"/><circle cx="37" cy="76" r="1.8"/><circle cx="50" cy="76" r="1.8"/><circle cx="63" cy="76" r="1.8"/><circle cx="76" cy="76" r="1.8"/>
    </g>
    <!-- anillo medio: más presente -->
    <g opacity="0.68">
      <circle cx="37" cy="37" r="3.2"/><circle cx="50" cy="37" r="3.2"/><circle cx="63" cy="37" r="3.2"/>
      <circle cx="37" cy="50" r="3.2"/><circle cx="63" cy="50" r="3.2"/>
      <circle cx="37" cy="63" r="3.2"/><circle cx="50" cy="63" r="3.2"/><circle cx="63" cy="63" r="3.2"/>
    </g>
    <!-- centro: nítido -->
    <circle cx="50" cy="50" r="6"/>
  </g>
</svg>
