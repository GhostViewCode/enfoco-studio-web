<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · En Foco Studio</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23151310'/><g fill='%23C1603F'><g opacity='.5'><circle cx='7' cy='7' r='2.1'/><circle cx='16' cy='7' r='2.1'/><circle cx='25' cy='7' r='2.1'/><circle cx='7' cy='16' r='2.1'/><circle cx='25' cy='16' r='2.1'/><circle cx='7' cy='25' r='2.1'/><circle cx='16' cy='25' r='2.1'/><circle cx='25' cy='25' r='2.1'/></g><circle cx='16' cy='16' r='4.4'/></g></svg>">
<style>
  :root{--bone:#FAF8F5;--ink:#151310;--terra:#C1603F;--muted:#9A9086}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem;
       background:var(--ink);color:var(--bone);text-align:center;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.55}
  .n{font-family:Georgia,'Times New Roman',serif;font-size:clamp(3.5rem,12vw,7rem);
     line-height:1;letter-spacing:-.03em;color:var(--terra);margin:0}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;
     font-size:clamp(1.5rem,4vw,2.25rem);margin:1rem 0 .5rem}
  p{color:var(--muted);margin:0 auto;max-width:44ch}
  .links{margin-top:2rem}
  a{display:inline-block;margin:.4rem;padding:.8rem 1.4rem;border-radius:100px;
    background:var(--terra);color:var(--bone);text-decoration:none;font-weight:500}
  a.ghost{background:transparent;color:var(--bone);box-shadow:inset 0 0 0 1px rgba(250,248,245,.28)}
</style>
</head>
<body>
  <main>
    <p class="n">404</p>
    <h1>Esta página no existe</h1>
    <p>
      Puede que el enlace esté mal escrito o que hayamos movido algo de sitio.
      <br><span lang="en">This page doesn’t exist. The link may be wrong, or we moved something.</span>
    </p>
    <div class="links">
      <a href="/es/" hreflang="es">Volver al inicio</a>
      <a class="ghost" href="/en/" hreflang="en">Go to the English site</a>
    </div>
  </main>
</body>
</html>
