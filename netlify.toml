# =============================================================================
#  CONFIGURACIÓN DE DESPLIEGUE EN NETLIFY
# =============================================================================

[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

# --- Seguridad: nada de esto debe llegar nunca al navegador -----------------
# El .env está además en .gitignore, pero si algún día se sube la carpeta a
# mano, estas reglas evitan que quede accesible desde una URL.
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package*.json"
  to = "/404.html"
  status = 404
  force = true

# --- Cabeceras --------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
