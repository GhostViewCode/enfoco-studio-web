<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En Foco Studio</title>
<meta name="description" content="Ponemos tu alojamiento en foco. Vídeo y mejora de imagen para anuncios de Airbnb y Booking, 100% online.">
<!-- Esta página solo redirige al idioma del navegador. No se indexa. -->
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://enfoco.site/es/">
<link rel="alternate" hreflang="es" href="https://enfoco.site/es/">
<link rel="alternate" hreflang="en" href="https://enfoco.site/en/">
<link rel="alternate" hreflang="x-default" href="https://enfoco.site/es/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23151310'/><g fill='%23C1603F'><g opacity='.5'><circle cx='7' cy='7' r='2.1'/><circle cx='16' cy='7' r='2.1'/><circle cx='25' cy='7' r='2.1'/><circle cx='7' cy='16' r='2.1'/><circle cx='25' cy='16' r='2.1'/><circle cx='7' cy='25' r='2.1'/><circle cx='16' cy='25' r='2.1'/><circle cx='25' cy='25' r='2.1'/></g><circle cx='16' cy='16' r='4.4'/></g></svg>">
<script>
  /* Detección del idioma del navegador.
     Si el visitante tiene el navegador en español va a /es/, si no a /en/.
     Se puede forzar con ?lang=es o ?lang=en. */
  (function () {
    var forced = (location.search.match(/[?&]lang=(es|en)/) || [])[1];
    var lang = forced || ((navigator.languages || [navigator.language || 'es'])[0] || 'es').slice(0, 2).toLowerCase();
    location.replace(lang === 'es' ? 'es/' : 'en/');
  })();
</script>
<style>
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:#151310;color:#FAF8F5;
       font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:2rem}
  a{color:#C1603F;display:inline-block;margin:.5rem .75rem;font-size:1.125rem}
</style>
</head>
<body>
  <!-- Solo se ve si el visitante tiene JavaScript desactivado -->
  <noscript>
    <p>Elige idioma / Choose your language</p>
  </noscript>
  <div>
    <p style="opacity:.7">En Foco Studio</p>
    <a href="es/" hreflang="es">Español</a>
    <a href="en/" hreflang="en">English</a>
  </div>
</body>
</html>
